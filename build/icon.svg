<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scratchpost app icon: a note with Bean's ears and face, its corner
       folded. Colours are the default Tint theme (teal 172, dark). Rendered
       to build/icon.png, which electron-builder turns into every size. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3835"/>
      <stop offset="1" stop-color="#0e201d"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#ground)"/>
  <!-- ears -->
  <path d="M250 440 L292 190 L452 330 Z M774 440 L732 190 L572 330 Z" fill="#97d8cf" stroke="#97d8cf" stroke-width="56" stroke-linejoin="round"/>
  <path d="M300 330 L318 246 L392 306 Z M724 330 L706 246 L632 306 Z" fill="#f1b3b1" stroke="#f1b3b1" stroke-width="22" stroke-linejoin="round"/>
  <!-- the note, bottom-right corner folded -->
  <path d="M362 330 H662 Q802 330 802 470 V700 L650 852 H362 Q222 852 222 712 V470 Q222 330 362 330 Z" fill="#97d8cf"/>
  <path d="M802 700 L650 852 V760 Q650 700 710 700 Z" fill="#72b6ad"/>
  <!-- face -->
  <ellipse cx="410" cy="500" rx="38" ry="44" fill="#0f2c28"/>
  <ellipse cx="614" cy="500" rx="38" ry="44" fill="#0f2c28"/>
  <circle cx="424" cy="482" r="14" fill="#f6fbfa"/>
  <circle cx="628" cy="482" r="14" fill="#f6fbfa"/>
  <path d="M494 552 h36 l-18 20 z" fill="#f1b3b1" stroke="#f1b3b1" stroke-width="10" stroke-linejoin="round"/>
  <path d="M482 590 q15 16 30 0 q15 16 30 0" fill="none" stroke="#0f2c28" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="326" cy="566" rx="40" ry="21" fill="#f1b3b1" opacity=".75"/>
  <ellipse cx="698" cy="566" rx="40" ry="21" fill="#f1b3b1" opacity=".75"/>
  <!-- writing -->
  <path d="M312 690 H560 M312 760 H480" stroke="#72b6ad" stroke-width="30" stroke-linecap="round"/>
</svg>
