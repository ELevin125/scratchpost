# Packaging (3.5). Windows: NSIS installer. Linux: AppImage and .deb.
appId: com.scratchpost.app
productName: Scratchpost
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
fileAssociations:
  - ext: md
    name: Markdown note
    role: Editor
  - ext: txt
    name: Text note
    role: Editor
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  icon: build/icons
  category: Utility
  syncDesktopName: true
  mimeTypes: [text/markdown, text/plain]
  maintainer: ELevin125
